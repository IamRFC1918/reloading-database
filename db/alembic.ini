# Die DB-URL kommt nicht aus dieser Datei, sondern aus backend/config.py
# (bzw. der Verbindung, die manage.py migrate übergibt).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../backend

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
