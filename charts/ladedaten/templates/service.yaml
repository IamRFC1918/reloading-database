apiVersion: v1
kind: Service
metadata:
  name: {{ include "ladedaten.fullname" . }}
  labels:
    {{- include "ladedaten.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "ladedaten.selectorLabels" (dict "ctx" . "component" "app") | nindent 4 }}
