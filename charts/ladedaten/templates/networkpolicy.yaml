{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ladedaten.fullname" . }}
  labels:
    {{- include "ladedaten.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ladedaten.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8000
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # Nur zur Datenbank
    {{- if eq .Values.database.mode "internal" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "ladedaten.selectorLabels" (dict "ctx" . "component" "mariadb") | nindent 14 }}
      ports:
        - port: 3306
    {{- else }}
    - ports:
        - port: {{ .Values.networkPolicy.externalDatabase.port }}
      {{- with .Values.networkPolicy.externalDatabase.cidr }}
      to:
        - ipBlock:
            cidr: {{ . }}
      {{- end }}
    {{- end }}
{{- if eq .Values.database.mode "internal" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ladedaten.mariadbName" . }}
  labels:
    {{- include "ladedaten.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ladedaten.selectorLabels" (dict "ctx" . "component" "mariadb") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "ladedaten.selectorLabels" (dict "ctx" . "component" "app") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "ladedaten.selectorLabels" (dict "ctx" . "component" "backup") | nindent 14 }}
      ports:
        - port: 3306
  # MariaDB braucht keinen ausgehenden Verkehr
  egress: []
{{- end }}
{{- if .Values.backup.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ladedaten.fullname" . }}-backup
  labels:
    {{- include "ladedaten.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ladedaten.selectorLabels" (dict "ctx" . "component" "backup") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- if eq .Values.database.mode "internal" }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "ladedaten.selectorLabels" (dict "ctx" . "component" "mariadb") | nindent 14 }}
      ports:
        - port: 3306
    {{- else }}
    - ports:
        - port: {{ .Values.networkPolicy.externalDatabase.port }}
      {{- with .Values.networkPolicy.externalDatabase.cidr }}
      to:
        - ipBlock:
            cidr: {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
