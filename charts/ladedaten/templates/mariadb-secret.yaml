{{- if and (eq .Values.database.mode "internal") (not .Values.mariadb.auth.existingSecret) }}
{{- $name := include "ladedaten.mariadbName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ladedaten.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
  annotations:
    # Passwort muss zum bestehenden Datenverzeichnis passen
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-password: {{ include "ladedaten.persistentSecret" (dict "ctx" . "secret" $name "key" "mariadb-password" "value" .Values.mariadb.auth.password) | b64enc | quote }}
  mariadb-root-password: {{ include "ladedaten.persistentSecret" (dict "ctx" . "secret" $name "key" "mariadb-root-password" "value" .Values.mariadb.auth.rootPassword) | b64enc | quote }}
{{- end }}
